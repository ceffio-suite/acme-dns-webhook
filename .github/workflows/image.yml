name: image

# This is the CEFFIO build of the upstream solver, published under the name the
# installer references (ghcr.io/ceffio-suite/acme-dns-webhook). The upstream
# workflow is removed on purpose: it pushed to the upstream namespace, which
# this fork has no right to.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, must already exist (e.g. v1.1.1)"
        required: true
  # A VULNERABILITY FOUND AFTER THE RELEASE MUST BE SEEN WITHOUT WAITING FOR THE
  # NEXT ONE. Weekly, on the published image.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Needed by the push, and by nothing else: the attestations ride along with
      # the image, they do not get extra rights.
      packages: write
    steps:
      - name: Check out the source to build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # THE TAGGED SOURCE, NOT THE BRANCH: a dispatch publishes what the tag
          # says, not whatever main happened to contain at that moment.
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the tags
        # A PRE-RELEASE IS NEVER `latest`: a tag containing '-' updates only its
        # own version. Same rule as the rest of the suite.
        if: github.event_name != 'pull_request'
        id: tags
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          IMAGE="ghcr.io/ceffio-suite/acme-dns-webhook"
          TAGS="${IMAGE}:${TAG}"
          case "$TAG" in
            *-*) echo "prerelease tag: ':latest' is NOT updated" ;;
            *)   TAGS="${TAGS}"$'\n'"${IMAGE}:latest" ;;
          esac
          {
            echo "liste<<FIN_TAGS"
            echo "$TAGS"
            echo "FIN_TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build (no push on a pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: false
          build-args: |
            OCI_SOURCE=https://github.com/ceffio-suite/acme-dns-webhook
            OCI_VERSION=${{ github.ref_name }}

      - name: Build and push (tagged release)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # THE IMAGE CARRIES ITS BILL OF MATERIALS AND ITS PROVENANCE, so an
          # operator can ask the registry what is inside without trusting a
          # release note. The source is ours; the upstream is credited in the
          # label below.
          sbom: true
          provenance: mode=max
          tags: ${{ steps.tags.outputs.liste }}
          build-args: |
            OCI_SOURCE=https://github.com/ceffio-suite/acme-dns-webhook
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ inputs.tag || github.ref_name }}

      - name: Prove the image carries its SBOM and its provenance
        # "The build said pushed" proves nothing about the attestation; this
        # reads it back from the registry, the way an operator would.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/ceffio-suite/acme-dns-webhook:${{ inputs.tag || github.ref_name }}"
          for ATTESTATION in SBOM Provenance; do
            VALEUR="$(docker buildx imagetools inspect "$IMAGE" --format "{{ json .${ATTESTATION} }}")"
            echo "${ATTESTATION} of ${IMAGE}: $(echo "$VALEUR" | head -c 300)"
            if [ -z "$VALEUR" ] || [ "$VALEUR" = "null" ]; then
              echo "::error::${IMAGE} carries no ${ATTESTATION} attestation"
              exit 1
            fi
          done

  # THE IMAGE WE PUBLISH IS SCANNED, AND STAYS SCANNED: the tag does not change,
  # the vulnerability database does.
  #
  # WHY THIS JOB EXISTS AT ALL: Dependabot watches go.mod, and this repository
  # had no scan of the IMAGE it publishes — so the 26 alerts of August 2026 were
  # found in the algebra of dependencies, and nothing looked at the artefact
  # that installations actually pull.
  scan:
    name: scan the published image
    needs: build
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Scan the image
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          # ON A TAG, THAT TAG; ON THE WEEKLY RUN, `latest`, the version an
          # installation pulls when it does not pin.
          image: ghcr.io/ceffio-suite/acme-dns-webhook:${{ github.event_name == 'schedule' && 'latest' || inputs.tag || github.ref_name }}
          # THE SAME RULE AS THE REST OF THE SUITE: only a CRITICAL finding WITH a
          # fix stops the job. Everything else is reported.
          severity-cutoff: critical
          only-fixed: true
          fail-build: true
          output-format: json
          output-file: grype-acme.json
          grype-version: v0.121.0
          cache-db: true

      - name: Keep the report
        # A GATE THAT FAILS WITHOUT ITS EVIDENCE COSTS A SECOND RUN: the JSON is
        # the only way to read WHAT was found, and it dies with the runner.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-acme
          path: grype-acme.json
          if-no-files-found: ignore

      - name: Summarise the scan
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s grype-acme.json ]; then
            echo "### Grype, image acme-dns-webhook — aucun rapport produit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - grype-acme.json >> "$GITHUB_STEP_SUMMARY" <<'FIN_PYTHON'
          import json, sys
          d = json.load(open(sys.argv[1]))
          matches = d.get("matches") or []
          ordre = ["Critical", "High", "Medium", "Low", "Negligible", "Unknown"]
          compte = {s: [0, 0] for s in ordre}
          for m in matches:
              sev = (m.get("vulnerability") or {}).get("severity") or "Unknown"
              fixe = ((m.get("vulnerability") or {}).get("fix") or {}).get("state") == "fixed"
              if sev not in compte:
                  sev = "Unknown"
              compte[sev][0] += 1
              if fixe:
                  compte[sev][1] += 1
          print("### Grype, image acme-dns-webhook")
          print()
          print("| Sévérité | Total | Avec correctif |")
          print("|---|---|---|")
          for s in ordre:
              total, fixe = compte[s]
              if total or s == "Critical":
                  print("| %s | %d | %d |" % (s, total, fixe))
          print()
          print("%d vulnérabilité(s) au total, %d avec un correctif."
                % (sum(c[0] for c in compte.values()), sum(c[1] for c in compte.values())))
          # LES FAITS, DANS LE JOURNAL AUSSI : un tableau de compteurs dit qu'il y
          # a un problème, pas lequel. Le rapport complet part en artefact.
          print()
          print("Findings with a fix:")
          for m in matches:
              v = m.get("vulnerability") or {}
              if (v.get("fix") or {}).get("state") != "fixed":
                  continue
              a = m.get("artifact") or {}
              print("  %-9s %-32s %-20s fix=%s"
                    % (v.get("severity"), a.get("name"), v.get("id"),
                       ",".join((v.get("fix") or {}).get("versions") or [])))
          FIN_PYTHON
