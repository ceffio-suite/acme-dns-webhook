name: image

# This is the CEFFIO build of the upstream solver, published under the name the
# installer references (ghcr.io/ceffio-suite/acme-dns-webhook). The upstream
# workflow is removed on purpose: it pushed to the upstream namespace, which
# this fork has no right to.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, must already exist (e.g. v1.1.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Needed by the push, and by nothing else: the attestations ride along with
      # the image, they do not get extra rights.
      packages: write
    steps:
      - name: Check out the source to build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # THE TAGGED SOURCE, NOT THE BRANCH: a dispatch publishes what the tag
          # says, not whatever main happened to contain at that moment.
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the tags
        # A PRE-RELEASE IS NEVER `latest`: a tag containing '-' updates only its
        # own version. Same rule as the rest of the suite.
        if: github.event_name != 'pull_request'
        id: tags
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          IMAGE="ghcr.io/ceffio-suite/acme-dns-webhook"
          TAGS="${IMAGE}:${TAG}"
          case "$TAG" in
            *-*) echo "prerelease tag: ':latest' is NOT updated" ;;
            *)   TAGS="${TAGS}"$'\n'"${IMAGE}:latest" ;;
          esac
          {
            echo "liste<<FIN_TAGS"
            echo "$TAGS"
            echo "FIN_TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build (no push on a pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: false
          build-args: |
            OCI_SOURCE=https://github.com/ceffio-suite/acme-dns-webhook
            OCI_VERSION=${{ github.ref_name }}

      - name: Build and push (tagged release)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # THE IMAGE CARRIES ITS BILL OF MATERIALS AND ITS PROVENANCE, so an
          # operator can ask the registry what is inside without trusting a
          # release note. The source is ours; the upstream is credited in the
          # label below.
          sbom: true
          provenance: mode=max
          tags: ${{ steps.tags.outputs.liste }}
          build-args: |
            OCI_SOURCE=https://github.com/ceffio-suite/acme-dns-webhook
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ inputs.tag || github.ref_name }}

      - name: Prove the image carries its SBOM and its provenance
        # "The build said pushed" proves nothing about the attestation; this
        # reads it back from the registry, the way an operator would.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/ceffio-suite/acme-dns-webhook:${{ inputs.tag || github.ref_name }}"
          for ATTESTATION in SBOM Provenance; do
            VALEUR="$(docker buildx imagetools inspect "$IMAGE" --format "{{ json .${ATTESTATION} }}")"
            echo "${ATTESTATION} of ${IMAGE}: $(echo "$VALEUR" | head -c 300)"
            if [ -z "$VALEUR" ] || [ "$VALEUR" = "null" ]; then
              echo "::error::${IMAGE} carries no ${ATTESTATION} attestation"
              exit 1
            fi
          done
